/* ===== EMPRESAS ===== */
.biz-hero{position:relative;padding:clamp(56px,8vw,100px) 0;background:radial-gradient(800px 500px at 88% -10%,rgba(29,78,216,.14),transparent 60%),radial-gradient(600px 400px at 10% 90%,rgba(34,197,94,.10),transparent 60%),linear-gradient(180deg,#fff,var(--bg-soft));overflow:hidden}
.biz-hero-glow{position:absolute;width:560px;height:560px;right:-180px;top:-200px;border-radius:50%;background:radial-gradient(circle,rgba(29,78,216,.25),transparent 65%);filter:blur(20px);pointer-events:none}
.biz-hero-inner{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(32px,5vw,64px);align-items:center}
.biz-hero-copy h1{margin-bottom:20px}
.biz-hero-copy p{font-size:clamp(1rem,1.4vw,1.14rem);max-width:560px;color:var(--ink-700)}
.biz-hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.biz-hero-points{display:grid;gap:12px}
.biz-hero-points li{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fff;border:1.5px solid var(--ink-200);border-radius:var(--radius);font-weight:600;font-size:.94rem;color:var(--ink-800);transition:transform var(--t),box-shadow var(--t)}
.biz-hero-points li:nth-child(4n+1){border-left:4px solid var(--blue-500)}
.biz-hero-points li:nth-child(4n+2){border-left:4px solid var(--green-500)}
.biz-hero-points li:nth-child(4n+3){border-left:4px solid var(--yellow-500)}
.biz-hero-points li:nth-child(4n+4){border-left:4px solid var(--red-500)}
.biz-hero-points li:hover{transform:translateX(6px);box-shadow:var(--shadow-sm)}
.biz-hero-points .ic{width:22px;height:22px;padding:3px;border-radius:50%;stroke-width:2.4}
.biz-hero-points li:nth-child(4n+1) .ic{background:var(--blue-100);color:var(--blue-600)}
.biz-hero-points li:nth-child(4n+2) .ic{background:var(--green-100);color:var(--green-600)}
.biz-hero-points li:nth-child(4n+3) .ic{background:var(--yellow-100);color:var(--yellow-700)}
.biz-hero-points li:nth-child(4n+4) .ic{background:var(--red-100);color:var(--red-600)}
.sol-card{position:relative;padding:26px 22px;background:#fff;border:1.5px solid var(--ink-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);transition:transform var(--t),box-shadow var(--t),border-color var(--t);overflow:hidden}
.sol-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--sc-color,var(--blue-500))}
.sol-card::after{content:"";position:absolute;top:-60px;right:-60px;width:160px;height:160px;border-radius:50%;background:var(--sc-bg,var(--blue-50));opacity:.55;transition:transform var(--t-slow);z-index:0}
.sol-card:hover{transform:translateY(-6px);box-shadow:0 18px 40px var(--sc-shadow,rgba(29,78,216,.2));border-color:var(--sc-color,var(--blue-500))}
.sol-card:hover::after{transform:scale(1.25)}
.sol-card > *{position:relative;z-index:1}
.sol-card:nth-child(6n+1){--sc-color:var(--blue-500);--sc-bg:var(--blue-50);--sc-shadow:rgba(29,78,216,.2)}
.sol-card:nth-child(6n+2){--sc-color:var(--purple-500);--sc-bg:var(--purple-100);--sc-shadow:rgba(139,92,246,.2)}
.sol-card:nth-child(6n+3){--sc-color:var(--green-500);--sc-bg:var(--green-50);--sc-shadow:rgba(34,197,94,.2)}
.sol-card:nth-child(6n+4){--sc-color:var(--yellow-500);--sc-bg:var(--yellow-50);--sc-shadow:rgba(250,204,21,.28)}
.sol-card:nth-child(6n+5){--sc-color:var(--red-500);--sc-bg:var(--red-50);--sc-shadow:rgba(239,68,68,.2)}
.sol-card:nth-child(6n+6){--sc-color:var(--orange-500);--sc-bg:var(--orange-100);--sc-shadow:rgba(249,115,22,.22)}
.sol-card .cat-icon{background:var(--sc-bg);color:var(--sc-color);margin-bottom:14px}
.sol-card:hover .cat-icon{background:var(--sc-color);color:#fff;transform:scale(1.08) rotate(-4deg)}
.sol-card h3{margin-bottom:12px}
.sol-card ul{display:grid;gap:8px}
.sol-card ul li{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink-700)}
.sol-card ul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sc-color);flex-shrink:0}
.contract-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(32px,5vw,64px);align-items:center}
.contract-note-light{font-size:.84rem;color:#8FA6CC;margin-top:20px;font-style:italic}
.contract-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contract-list li{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;font-size:.88rem;font-weight:600;color:#E5EDFF;transition:transform var(--t-fast),background var(--t-fast)}
.contract-list li:hover{transform:translateX(4px);background:rgba(255,255,255,.12)}
.contract-list li:nth-child(12n+1){border-left:3px solid var(--blue-500)}
.contract-list li:nth-child(12n+2){border-left:3px solid var(--green-500)}
.contract-list li:nth-child(12n+3){border-left:3px solid var(--yellow-500)}
.contract-list li:nth-child(12n+4){border-left:3px solid var(--red-500)}
.contract-list li:nth-child(12n+5){border-left:3px solid var(--purple-500)}
.contract-list li:nth-child(12n+6){border-left:3px solid var(--orange-500)}
.contract-list li:nth-child(12n+7){border-left:3px solid var(--blue-500)}
.contract-list li:nth-child(12n+8){border-left:3px solid var(--green-500)}
.contract-list li:nth-child(12n+9){border-left:3px solid var(--yellow-500)}
.contract-list li:nth-child(12n+10){border-left:3px solid var(--red-500)}
.contract-list li:nth-child(12n+11){border-left:3px solid var(--purple-500)}
.contract-list li:nth-child(12n+12){border-left:3px solid var(--orange-500)}
.contract-list .ic{width:18px;height:18px;color:#7EA6FF}
.proposta-wrap{max-width:820px;margin:0 auto;background:#fff;border:1.5px solid var(--ink-200);border-radius:var(--radius-xl);padding:clamp(24px,3vw,40px);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.proposta-wrap::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--blue-500),var(--green-500),var(--yellow-500),var(--red-500))}
.dark-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(126,166,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(126,166,255,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at center,black,transparent 75%);-webkit-mask-image:radial-gradient(circle at center,black,transparent 75%);pointer-events:none}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.step{position:relative;padding:32px 24px;background:#fff;border:1.5px solid var(--ink-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);transition:transform var(--t),box-shadow var(--t),border-color var(--t);overflow:hidden}
.step::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--step-color,var(--blue-500))}
.step:hover{transform:translateY(-6px);box-shadow:0 16px 40px var(--step-shadow,rgba(29,78,216,.18));border-color:var(--step-color,var(--blue-500))}
.step:nth-child(1){--step-color:var(--blue-500);--step-shadow:rgba(29,78,216,.2)}
.step:nth-child(2){--step-color:var(--green-500);--step-shadow:rgba(34,197,94,.2)}
.step:nth-child(3){--step-color:var(--yellow-500);--step-shadow:rgba(250,204,21,.28)}
.step:nth-child(4){--step-color:var(--red-500);--step-shadow:rgba(239,68,68,.2)}
.step-number{position:absolute;top:20px;right:22px;font-size:2.4rem;font-weight:800;color:var(--step-color);opacity:.18;line-height:1}
.step-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--step-color);color:#fff;margin-bottom:18px;box-shadow:0 8px 18px var(--step-shadow)}
.step-icon .ic{width:24px;height:24px}
.step h3{margin-bottom:8px}
.step p{font-size:.92rem;margin:0}
.why-card{padding:26px 22px;background:#fff;border:1.5px solid var(--ink-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);transition:transform var(--t),box-shadow var(--t),border-color var(--t);position:relative;overflow:hidden}
.why-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--wc-color,var(--blue-500))}
.why-card:hover{transform:translateY(-6px);box-shadow:0 16px 40px var(--wc-shadow);border-color:var(--wc-color)}
.why-card:nth-child(6n+1){--wc-color:var(--blue-500);--wc-shadow:rgba(29,78,216,.2)}
.why-card:nth-child(6n+2){--wc-color:var(--green-500);--wc-shadow:rgba(34,197,94,.2)}
.why-card:nth-child(6n+3){--wc-color:var(--yellow-500);--wc-shadow:rgba(250,204,21,.28)}
.why-card:nth-child(6n+4){--wc-color:var(--red-500);--wc-shadow:rgba(239,68,68,.2)}
.why-card:nth-child(6n+5){--wc-color:var(--purple-500);--wc-shadow:rgba(139,92,246,.2)}
.why-card:nth-child(6n+6){--wc-color:var(--orange-500);--wc-shadow:rgba(249,115,22,.22)}
.why-card .cat-icon{margin-bottom:14px}
.why-card:nth-child(6n+1) .cat-icon{background:var(--blue-50);color:var(--blue-600)}
.why-card:nth-child(6n+2) .cat-icon{background:var(--green-50);color:var(--green-600)}
.why-card:nth-child(6n+3) .cat-icon{background:var(--yellow-50);color:var(--yellow-700)}
.why-card:nth-child(6n+4) .cat-icon{background:var(--red-50);color:var(--red-600)}
.why-card:nth-child(6n+5) .cat-icon{background:var(--purple-100);color:var(--purple-600)}
.why-card:nth-child(6n+6) .cat-icon{background:var(--orange-100);color:var(--orange-600)}
.why-card h3{margin-bottom:6px}
.why-card p{font-size:.92rem;margin:0}
@media (max-width:900px){
  .biz-hero-inner{grid-template-columns:1fr}
  .contract-wrap{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .contract-list{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .biz-hero-actions .btn{width:100%}
}
</style>
</head>
